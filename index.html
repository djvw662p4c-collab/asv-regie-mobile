:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101c2c;color:#ecf2f9}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{padding:20px 17px 13px;background:#15253a;border-bottom:1px solid #35465c;position:sticky;top:0;z-index:4}h1{font-size:19px;margin:4px 0}h2{font-size:17px;margin:0 0 10px}small,.muted{color:#b9c7d7}.brand{font-size:12px;letter-spacing:.13em;font-weight:800;color:#e8b958}.pill{font-size:11px;background:#493d2b;color:#ffdd91;border-radius:30px;padding:6px 9px}main{padding:16px 15px 110px;max-width:740px;margin:auto}.panel{background:#20334a;border:1px solid #344a63;border-radius:15px;padding:15px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{border:1px solid #3b5069;background:#253951;border-radius:14px;color:white;text-align:left;padding:18px 13px;min-height:110px;font-weight:700;font-size:15px}.tile b{display:block;color:#e8b958;font-size:25px;margin-bottom:9px}.tile small{display:block;font-weight:400;margin-top:6px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e8b958;outline-offset:2px}.action{background:#e8b958;color:#132035;border:0;border-radius:10px;padding:12px 14px;font-weight:750}.secondary{background:#344b65;color:white;border:1px solid #60748a;border-radius:10px;padding:11px 13px;font-weight:650}.danger{background:transparent;color:#ffaaaa;border:1px solid #bd6672;border-radius:10px;padding:11px}.full{width:100%;margin:7px 0}.notice{font-size:13px;line-height:1.5;color:#c5d3e2}.tiny{font-size:12px;color:#adbdcf}.filters{display:flex;gap:8px;margin:12px 0}.filters select,input[type=search]{min-width:0;width:100%;padding:12px;background:#263b54;color:white;border:1px solid #516782;border-radius:10px}.event{border-left:5px solid #8a97a8;padding:12px;background:#243750;border-radius:10px;margin:10px 0}.event strong{display:block;margin:5px 0}.montage{border-color:#3977d5}.spectacle{border-color:#e35a5a}.exploitation{border-color:#41b88a}.conference{border-color:#40b7c5}.repetition{border-color:#e8b958}.demontage{border-color:#aa86dd}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #42556d}.row:last-child{border:0}.row a{color:#ffcf7d}.tag{font-size:12px;background:#38536c;border-radius:8px;padding:5px 8px}nav{position:fixed;bottom:0;left:0;right:0;background:#15253a;border-top:1px solid #34475f;display:flex;justify-content:space-around;padding:8px 4px max(10px,env(safe-area-inset-bottom));z-index:5}nav button{background:none;border:0;color:#b8c6d7;font-size:11px;padding:6px 3px;min-width:58px}nav button[aria-current=page]{color:#e8b958;font-weight:700}nav b{display:block;font-size:20px;margin-bottom:3px}#viewer{position:fixed;inset:0;z-index:9;background:#101c2c;padding:20px;overflow:auto}#viewer iframe{width:100%;height:75vh;background:white;border:0;border-radius:8px}.hidden{display:none!important}.ok{color:#9be6b9}.warn{color:#ffd28a}.file{display:none}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}

'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}catch{return d}};
const phaseClass={'Montage':'montage','Spectacle':'spectacle','Exploitation':'exploitation','Conférence':'conference','Répétition':'repetition','Mise':'repetition','Démontage':'demontage'};
const content=document.getElementById('content');let data=null,tab='home',day='all',place='all',query='',currentBlobUrl=null;
function db(){return new Promise((resolve,reject)=>{const req=indexedDB.open('asv-regie-mobile-v02',1);req.onupgradeneeded=()=>req.result.createObjectStore('productions');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function store(value){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction('productions','readwrite');tx.objectStore('productions').put(value,'active');tx.oncomplete=()=>{d.close();resolve()};tx.onerror=()=>{d.close();reject(tx.error)}})}
async function restore(){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction('productions');const r=tx.objectStore('productions').get('active');r.onsuccess=()=>{d.close();resolve(r.result||null)};r.onerror=()=>{d.close();reject(r.error)}})}
async function clearStore(){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction('productions','readwrite');tx.objectStore('productions').delete('active');tx.oncomplete=()=>{d.close();resolve()};tx.onerror=()=>{d.close();reject(tx.error)}})}
function validate(o){if(!o||o.format!=='asv-regie-mobile'||o.version!==1)throw Error('Format non reconnu : utilisez un export ASV RÉGIE Mobile version 1.');if(!o.production||typeof o.production.name!=='string'||!o.production.name.trim())throw Error('Nom de production manquant.');for(const k of ['events','people','contacts','quotes'])if(!Array.isArray(o[k]))throw Error('Rubrique manquante : '+k);if(o.events.length>5000||o.people.length>5000||o.contacts.length>5000||o.quotes.length>300)throw Error('Le fichier contient trop d’éléments.');for(const q of o.quotes){if(typeof q.base64!=='string'||q.mime!=='application/pdf'||q.base64.length>14000000||!/^[A-Za-z0-9+/]*={0,2}$/.test(q.base64))throw Error('Pièce jointe invalide : seuls les PDF intégrés sont acceptés.')}return o}
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){document.getElementById('heading').textContent=({home:'Ma production',planning:'Planning par lieu et jour',personnel:'Planning du personnel',contacts:'Contacts',devis:'Devis et pièces jointes'})[tab];document.getElementById('subtitle').textContent=data?data.production.name+' · Import local':'Aucune production chargée · V0.3';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
if(tab==='home'){const p=data?.production;content.innerHTML=`<div class="panel"><h2>${p?esc(p.name):'Bienvenue sur ASV RÉGIE Mobile'}</h2><div class="tiny">${p?esc(p.period||'Période non renseignée'):'Prototype V0.3 · Consultation hors connexion'}</div><p class="notice">${p?esc(p.description||'Production importée et enregistrée localement sur cet iPhone.'):'Importez une production fictive pour essayer la consultation des plannings, personnels, contacts et devis PDF.'}</p><span class="${p?'ok':'warn'}">${p?'● Production disponible hors connexion':'● Aucun import effectué'}</span></div><div class="panel"><h2>Importer une production</h2><p class="notice">Fichier JSON au format ASV RÉGIE Mobile. L’import remplace la production actuellement chargée. L’import reste dans le navigateur de cet appareil : aucune transmission réseau des données importées. Le stockage local n’est pas chiffré par cette application.</p><button class="action full" id="importBtn">Importer un fichier de production</button><button class="secondary full" id="demoBtn">Charger la production fictive intégrée</button>${p?'<button class="danger full" id="clearBtn">Effacer la production locale</button>':''}<p class="tiny" id="feedback" role="status"></p></div>${p?`<div class="grid">${[['planning','▦','Planning',data.events.length+' activités'],['personnel','♙','Personnel',data.people.length+' personnes'],['contacts','☏','Contacts',data.contacts.length+' contacts'],['devis','▤','Devis',data.quotes.length+' documents']].map(x=>`<button class="tile" data-go="${x[0]}"><b>${x[1]}</b>${x[2]}<small>${x[3]}</small></button>`).join('')}</div>`:''}<p class="notice">Lecture seule · une production à la fois · import local · données non chiffrées sur cet appareil. Protégez votre iPhone par code/Face ID.</p>`;document.getElementById('importBtn').onclick=()=>document.getElementById('fileImport').click();document.getElementById('demoBtn').onclick=loadDemo;document.getElementById('clearBtn')?.addEventListener('click',async()=>{if(confirm('Effacer la production enregistrée sur cet iPhone ?')){await clearStore();data=null;render()}});content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));return}
if(!data){content.innerHTML='<div class="panel"><h2>Aucune production importée</h2><p class="notice">Ouvrez Accueil pour charger le fichier de démonstration.</p><button class="action" id="backHome">Aller à l’accueil</button></div>';document.getElementById('backHome').onclick=()=>go('home');return}
if(tab==='planning'){const days=[...new Set(data.events.map(e=>e.day))].sort(),places=[...new Set(data.events.map(e=>e.place))].sort();content.innerHTML=`<div class="filters"><select id="day" aria-label="Jour"><option value="all">Tous les jours</option>${days.map(d=>`<option value="${esc(d)}" ${d===day?'selected':''}>${esc(fmt(d))}</option>`).join('')}</select><select id="place" aria-label="Lieu"><option value="all">Tous les lieux</option>${places.map(p=>`<option value="${esc(p)}" ${p===place?'selected':''}>${esc(p)}</option>`).join('')}</select></div>${data.events.filter(e=>(day==='all'||e.day===day)&&(place==='all'||e.place===place)).sort((a,b)=>(a.day+a.start+a.place).localeCompare(b.day+b.start+b.place)).map(e=>`<article class="event ${phaseClass[e.phase]||''}"><small>${esc(fmt(e.day))} · ${esc(e.place)}</small><strong>${esc(e.start)}–${esc(e.end)} · ${esc(e.desc)}</strong><div>${esc(e.phase)} <span class="tiny">· ${esc(e.staff||'')}</span></div></article>`).join('')||'<p class="notice">Aucune activité pour ce filtre.</p>'}`;document.getElementById('day').onchange=e=>{day=e.target.value;render()};document.getElementById('place').onchange=e=>{place=e.target.value;render()}}
if(tab==='personnel'){content.innerHTML=`<input type="search" id="find" placeholder="Nom ou qualification" aria-label="Rechercher le personnel" value="${esc(query)}"><div id="people"></div>`;const draw=()=>{document.getElementById('people').innerHTML=data.people.filter(p=>(p.name+' '+p.job).toLocaleLowerCase('fr').includes(query.toLocaleLowerCase('fr'))).map(p=>`<div class="panel"><h2>${esc(p.name)} <span class="tag">${esc(p.job)}</span></h2>${p.shifts.map(s=>`<div class="row"><div><strong>${esc(fmt(s.day))}</strong><br><small>${esc(s.place)}</small></div><strong>${esc(s.start)}–${esc(s.end)}</strong></div>`).join('')}</div>`).join('')||'<p>Aucun résultat.</p>'};draw();document.getElementById('find').oninput=e=>{query=e.target.value;draw()}}
if(tab==='contacts')content.innerHTML=data.contacts.map(c=>`<div class="panel"><h2>${esc(c.name)}</h2><p class="muted">${esc(c.job)}</p><div class="row"><span>Téléphone</span><a href="tel:${esc(String(c.tel||'').replace(/[^+0-9]/g,''))}">${esc(c.tel||'Non renseigné')}</a></div><div class="row"><span>E-mail</span><a href="mailto:${esc(c.mail||'')}">${esc(c.mail||'Non renseigné')}</a></div></div>`).join('')||'<p>Aucun contact.</p>';
if(tab==='devis'){content.innerHTML='<div class="panel"><h2>Devis PDF importés</h2><p class="notice">Les documents intégrés au fichier de production sont consultables localement. Selon iOS, l’aperçu PDF peut s’ouvrir dans une nouvelle vue.</p></div>'+data.quotes.map((q,i)=>`<div class="panel"><div class="row"><div><strong>${esc(q.number)}</strong><br><small>${esc(q.supplier)} · ${esc(q.category||'')}</small></div><button class="action" data-pdf="${i}">Ouvrir</button></div></div>`).join('');content.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>openPdf(Number(b.dataset.pdf)))}}
async function apply(o){const parsed=validate(o);await store(parsed);data=parsed;day='all';place='all';query='';go('home')}
async function loadDemo(){try{await apply(JSON.parse(document.getElementById('demoData').textContent));document.getElementById('feedback').textContent='Production fictive chargée et enregistrée.'}catch(e){document.getElementById('feedback').textContent='Erreur : '+e.message}}
document.getElementById('fileImport').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>18000000)throw Error('Fichier trop volumineux (maximum 18 Mo).');await apply(JSON.parse(await f.text()));document.getElementById('feedback').textContent='Import réussi : '+f.name}catch(err){alert('Import impossible : '+err.message)}finally{e.target.value=''}});
function openPdf(i){const q=data.quotes[i];try{const raw=atob(q.base64),arr=new Uint8Array(raw.length);for(let j=0;j<raw.length;j++)arr[j]=raw.charCodeAt(j);currentBlobUrl=URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));document.getElementById('viewerTitle').textContent=q.filename||q.number;document.getElementById('viewerBody').innerHTML='<p class="notice">Si le PDF ne s’affiche pas, utilisez « Ouvrir le PDF ».</p><p><a id="pdfLink" class="action" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener">Ouvrir le PDF</a></p><iframe id="pdfFrame" title="Document PDF"></iframe>';document.getElementById('pdfLink').href=currentBlobUrl;document.getElementById('pdfFrame').src=currentBlobUrl;document.getElementById('viewer').classList.remove('hidden')}catch(e){alert('Impossible d’ouvrir ce PDF : '+e.message)}}
document.getElementById('closeViewer').onclick=()=>{document.getElementById('viewer').classList.add('hidden');document.getElementById('viewerBody').innerHTML='';if(currentBlobUrl){URL.revokeObjectURL(currentBlobUrl);currentBlobUrl=null}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));render();restore().then(o=>{if(o){try{data=validate(o)}catch(e){console.warn(e)}render()}}).catch(()=>{content.insertAdjacentHTML('afterbegin','<p class="warn">Le stockage local est indisponible sur cet appareil.</p>')});if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
