:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#ecf2f9;background:#101c2c}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100dvh}header{padding:22px 18px 14px;background:#15253a;position:sticky;top:0;z-index:5;border-bottom:1px solid #35465c}h1{font-size:19px;margin:2px 0 4px}small,.muted{color:#b5c3d4}small{font-size:12px}.brand{font-weight:800;letter-spacing:.14em;color:#e8b958;font-size:12px}.demo{background:#513b20;color:#ffe1a0;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700}main{padding:18px 16px 100px;max-width:700px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.panel{background:#20334a;border:1px solid #344a63;border-radius:16px;padding:15px;margin-bottom:13px}.panel h2{margin:0 0 8px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:#253951;border:1px solid #3b5069;border-radius:16px;text-align:left;padding:20px 13px;color:white;min-height:126px;font-size:16px;font-weight:700;cursor:pointer}.tile span{display:block;font-size:27px;color:#e8b958;margin-bottom:11px}.tile small{display:block;margin-top:6px;font-weight:400;line-height:1.3}button,select,input{font:inherit}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e8b958;outline-offset:3px}.back{background:transparent;border:0;color:#f0bd62;padding:10px 0;font-size:15px;font-weight:600}.filters{display:flex;gap:8px;margin:12px 0}.filters select,.filters input{width:100%;min-width:0;background:#263b54;color:white;border:1px solid #516782;border-radius:10px;padding:12px}.event{border-left:5px solid #8a97a8;padding:12px;background:#243750;border-radius:10px;margin:10px 0}.event strong{display:block;margin-bottom:4px}.event small{color:#d8e2ef}.montage{border-color:#3977d5;background:#1d3655}.spectacle{border-color:#e35a5a;background:#482c3b}.exploitation{border-color:#41b88a;background:#1c453f}.conference{border-color:#40b7c5;background:#1d424b}.repetition{border-color:#e8b958;background:#493d2b}.demontage{border-color:#aa86dd;background:#3b3255}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #42556d}.row:last-child{border:0}.row a{color:#ffcf7d;text-decoration:none;font-weight:600;overflow-wrap:anywhere}.tag{font-size:12px;background:#38536c;padding:5px 7px;border-radius:8px}.notice{color:#c5d3e2;font-size:13px;line-height:1.5}.action{background:#d9a441;color:#132035;border:0;border-radius:10px;padding:11px 13px;font-weight:700;cursor:pointer}.status{font-size:12px;color:#92e2b8}.hidden{display:none!important}nav{position:fixed;bottom:0;left:0;right:0;background:#15253a;border-top:1px solid #34475f;padding:9px 6px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:5}nav button{border:0;background:none;color:#b8c6d7;font-size:11px;padding:6px;min-width:60px}nav button[aria-current=page]{color:#e8b958;font-weight:700}nav b{display:block;font-size:20px;margin-bottom:3px}iframe{width:100%;height:55vh;border:0;background:white;border-radius:8px}#docModal{position:fixed;inset:0;background:#101c2c;z-index:10;padding:18px;overflow:auto}#docModal h2{font-size:18px}.tiny{font-size:12px;color:#a9b9ca}
</style></head><body><header><div class="top"><div><div class="brand">ASV RÉGIE · MOBILE</div><h1 id="heading">Ma production</h1><small id="subtitle">Festival Horizon · Données fictives</small></div><span class="demo">DÉMO</span></div></header><main id="content"></main><nav id="nav" aria-label="Navigation"><button data-tab="home" aria-current="page"><b>⌂</b>Accueil</button><button data-tab="planning"><b>▦</b>Planning</button><button data-tab="personnel"><b>♙</b>Personnel</button><button data-tab="contacts"><b>☏</b>Contacts</button><button data-tab="devis"><b>▤</b>Devis</button></nav><div id="docModal" class="hidden"><button class="back" id="closeDoc">← Retour aux devis</button><h2>Devis technique — exemple</h2><p class="notice">Document de démonstration généré dans l'application. Le vrai prototype devra intégrer les PDF dans l'export.</p><iframe title="Aperçu du devis fictif" id="docFrame"></iframe></div><script>

const people=[{name:'Camille Bernard',job:'Régie générale',shifts:[['24 oct.','08:00–18:00','Grande salle'],['25 oct.','10:00–23:00','Grande salle']]},{name:'Alex Martin',job:'TP',shifts:[['24 oct.','08:00–17:00','Grande salle'],['25 oct.','18:00–23:00','Grande salle']]},{name:'Samira Petit',job:'TL',shifts:[['24 oct.','08:00–17:00','Grande salle'],['25 oct.','18:00–23:00','Grande salle']]},{name:'Nicolas Durand',job:'Roadie',shifts:[['24 oct.','08:00–12:00','Grande salle'],['25 oct.','18:00–23:00','Grande salle']]}];

const content=document.querySelector('#content');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='home',day='all',place='all',search='';const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});const classes={Montage:'montage',Spectacle:'spectacle',Exploitation:'exploitation',Conférence:'conference',Répétition:'repetition',Mise:'repetition',Démontage:'demontage'};
function render(){document.querySelector('#heading').textContent=({home:'Ma production',planning:'Planning par lieu et jour',personnel:'Planning du personnel',contacts:'Contacts',devis:'Devis et pièces jointes'})[tab];document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));if(tab==='home'){content.innerHTML=`<div class="panel"><div class="top"><div><h2>Festival Horizon</h2><small>24–25 octobre 2026 · Production fictive</small></div><span class="status">● Démo hors ligne</span></div><p class="notice">Prototype de consultation sur iPhone 15. Une seule production, lecture seule et aucune donnée réelle.</p></div><div class="grid">${[['planning','▦','Planning','Par lieu et par jour'],['personnel','♙','Personnel','Jours et horaires'],['contacts','☏','Contacts','Appels et e-mails'],['devis','▤','Devis','Documents joints']].map(x=>`<button class="tile" data-go="${x[0]}"><span>${x[1]}</span>${x[2]}<small>${x[3]}</small></button>`).join('')}</div><div class="panel" style="margin-top:16px"><strong>Dernier export</strong><p class="notice">Démonstration intégrée · aucune synchronisation automatique</p><span class="tiny">Version de test 0.1 · aucune donnée de production transférée</span></div>`;content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));}
if(tab==='planning'){const days=[...new Set(events.map(e=>e.day))],places=[...new Set(events.map(e=>e.place))];content.innerHTML=`<div class="filters"><select id="day" aria-label="Jour"><option value="all">Tous les jours</option>${days.map(d=>`<option value="${d}" ${d===day?'selected':''}>${dateLabel(d)}</option>`).join('')}</select><select id="place" aria-label="Lieu"><option value="all">Tous les lieux</option>${places.map(p=>`<option ${p===place?'selected':''}>${p}</option>`).join('')}</select></div><div id="events">${events.filter(e=>(day==='all'||e.day===day)&&(place==='all'||e.place===place)).map(e=>`<article class="event ${classes[e.phase]||''}"><small>${dateLabel(e.day)} · ${esc(e.place)}</small><strong>${esc(e.time)} · ${esc(e.desc)}</strong><div>${esc(e.phase)} <span class="tiny">· ${esc(e.staff)}</span></div></article>`).join('')||'<p>Aucune activité pour ce filtre.</p>'}</div>`;document.querySelector('#day').onchange=e=>{day=e.target.value;render()};document.querySelector('#place').onchange=e=>{place=e.target.value;render()};}
if(tab==='personnel'){content.innerHTML=`<input id="find" aria-label="Rechercher un technicien" placeholder="Rechercher un nom ou une qualification" value="${esc(search)}" style="width:100%;background:#263b54;color:white;border:1px solid #516782;border-radius:10px;padding:13px;margin-bottom:14px"><div id="people"></div>`;const target=document.querySelector('#people');const draw=()=>{target.innerHTML=people.filter(p=>(p.name+' '+p.job).toLocaleLowerCase('fr').includes(search.toLocaleLowerCase('fr'))).map(p=>`<div class="panel"><h2>${esc(p.name)} <span class="tag">${esc(p.job)}</span></h2>${p.shifts.map(s=>`<div class="row"><div><strong>${esc(s[0])}</strong><br><small>${esc(s[2])}</small></div><strong>${esc(s[1])}</strong></div>`).join('')}</div>`).join('')||'<p>Aucun résultat.</p>'};draw();document.querySelector('#find').oninput=e=>{search=e.target.value;draw()};}
if(tab==='contacts'){content.innerHTML=contacts.map(c=>`<div class="panel"><h2>${esc(c.name)}</h2><p class="muted">${esc(c.job)}</p><div class="row"><span>Téléphone</span><a href="tel:${esc(c.tel)}">Appeler</a></div><div class="row"><span>E-mail</span><a href="mailto:${esc(c.mail)}">Écrire</a></div></div>`).join('')+'<p class="notice">Coordonnées fictives pour la démonstration. Les boutons ouvrent les fonctions de l’iPhone.</p>';}
if(tab==='devis'){content.innerHTML=`<div class="panel"><h2>Documents de la production</h2><p class="notice">Les vrais devis PDF seront inclus dans le paquet mobile lors du développement de l'export. Le document ci-dessous est un aperçu fictif.</p></div><div class="panel"><div class="row"><div><strong>DEV-2026-001</strong><br><small>Prestataire technique — Son</small></div><button class="action" id="viewDoc">Ouvrir</button></div></div>`;document.querySelector('#viewDoc').onclick=showDoc;}}
function go(t){tab=t;render();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));function showDoc(){document.querySelector('#docModal').classList.remove('hidden');document.querySelector('#docFrame').srcdoc=`<!doctype html><html lang="fr"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font-family:Arial;padding:20px;color:#243142"><h2>DEVIS DE DÉMONSTRATION</h2><p>Prestataire technique — Son</p><hr><p>Location console et microphones</p><p>Prestation technique</p><hr><p><b>Document fictif — aucun montant réel</b></p></body></html>`;}document.querySelector('#closeDoc').onclick=()=>document.querySelector('#docModal').classList.add('hidden');render();if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
